[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localpilot-ai"
version = "0.1.0"
description = "A local-first AI coding agent runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2.0", "typer>=0.12", "rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "build"]

[project.scripts]
localpilot = "localpilot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/localpilot"]
